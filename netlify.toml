# What's New now lives in the Rails app as Release Notes, which is the system
# that actually gets updated. force = true so these win over any built page.
[[redirects]]
  from = "/whatsnew"
  to = "https://oldworldrankings.com/release-notes"
  status = 301
  force = true

[[redirects]]
  from = "/whatsnew/*"
  to = "https://oldworldrankings.com/release-notes"
  status = 301
  force = true

# Render origin, not the apex: Netlify can route an apex proxy back into this site and 301 it to www.
[[redirects]]
  from = "/api/*"
  to = "https://oldworldrankings.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback for any unmatched routes
[[redirects]]
  from = "/*"
  to = "/404/"
  status = 404
