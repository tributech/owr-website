[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Canonical www redirect — Netlify handles this at CDN level
# The Rails app will also 301 redirect www paths to this site

# Static pages hosted here
[[redirects]]
  from = "/pricing"
  to = "/pricing/"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy/"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms/"
  status = 200

# Docs moved to the Banshee help centre. Old slugs map to their help articles.
